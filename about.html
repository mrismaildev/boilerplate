<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ApexCharts Example</title>

  <!-- ApexCharts CDN -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f5f6fa;
      padding: 50px;
      text-align: center;
    }

    h2 {
      color: #333;
      background-color: teal;
    }

    #chart {
      max-width: 600px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>

  <h2>📈 Monthly Sales Report</h2>

  <!-- Chart Container -->
  <div id="chart"></div>

  <script>
    // Chart Configuration
    var options = {
      chart: {
        type: 'line',
        height: 350,
        toolbar: { show: false }
      },
      series: [{
        name: 'Sales',
        data: [150, 200, 180, 220, 300, 280, 350, 400, 370, 420, 500, 600]
      }],
      xaxis: {
        categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
      },
      colors: ['#00BFFF'],
      dataLabels: {
        enabled: true
      },
      stroke: {
        curve: 'smooth',
        width: 3
      },
      grid: {
        borderColor: '#eee'
      },
      title: {
        text: 'Sales Growth 2025',
        align: 'center'
      }
    };

    // Render Chart
    var chart = new ApexCharts(document.querySelector("#chart"), options);
    chart.render();
  </script>

</body>

</html>
